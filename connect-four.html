/* ============================================================
   State persistence
   ============================================================ */
// The series state is saved under STATE_KEY so a reload (for example after
// changing this file) resumes where play stopped. It is saved only at
// boundaries — a game starting, each move played, each notes update, Reset
// scores — so the stored copy never holds part of a move. The log, token
// counts and calls() trace are not saved.
//
// Format:
//   { records: [game], game: game | null, notes: {1, 2}, notesPending: [p],
//     plans: {1, 2}, scores: {1, 2, draws},
//     stats: {1: {truncated, fallbacks}, 2: {truncated, fallbacks}} }
//   game = { first: 1 | 2, moves: [{ c, say }] }, c 0-based.
// A game is stored as who moved first and its moves; board, result and
// winning cells are rebuilt by replaying it. `game` is the game in progress,
// or null once the last game has finished (it is then the last record).
//
// Saves from earlier versions lack fields added since, so a missing field at
// any depth takes its default. Only a game's `first` and `moves` and a move's
// `c` have no default. A field that is present but invalid stops the whole
// load (see loadState); a format change must therefore keep reading the old
// format.

// A new, empty game numbered n: Red opens odd-numbered games, Yellow even ones.
function newGame(n){
  const g = new Game();
  g.turn = n % 2 === 1 ? RED : YELLOW;
  return g;
}

function gameData(g){
  return {
    first: g.moves.length ? g.moves[0].p : g.turn,
    moves: g.moves.map(m => ({ c: m.c, say: m.say || "" })),
  };
}

// A failed save (e.g. storage quota) throws: during a series it ends the
// series with the error shown, rather than continuing unsaved.
function saveState(){
  if (state.loadError) return;
  localStorage.setItem(STATE_KEY, JSON.stringify({
    records: state.records.map(gameData),
    game: state.game.over ? null : gameData(state.game),
    notes: state.notes,
    notesPending: state.notesPending,
    plans: state.plans,
    scores: state.scores,
    stats: state.stats,
  }));
}

class StateError extends Error {}
const isObj = v => v !== null && typeof v === "object" && !Array.isArray(v);
const invalid = (path, why) => new StateError(`${path} ${why}`);

// Readers for stored values: each takes the value (undefined when missing)
// and its path for error messages, and returns the default when missing, the
// value when valid, or throws a StateError.
function readString(v, path){
  if (v === undefined) return "";
  if (typeof v !== "string") throw invalid(path, "is not a string");
  return v;
}
function readCount(v, path){
  if (v === undefined) return 0;
  if (!Number.isInteger(v) || v < 0) throw invalid(path, "is not a non-negative integer");
  return v;
}
function readObject(v, path){
  if (v === undefined) return {};
  if (!isObj(v)) throw invalid(path, "is not an object");
  return v;
}
function readPlayers(v, path, read){
  const o = readObject(v, path);
  return { 1: read(o[1], `${path}.1`), 2: read(o[2], `${path}.2`) };
}

// Rebuilds a stored game by replaying its moves with Game.play, so every
// derived field follows from the moves and an illegal sequence is rejected.
function readGame(v, path){
  if (!isObj(v)) throw invalid(path, "is not an object");
  if (v.first !== RED && v.first !== YELLOW) throw invalid(`${path}.first`, "is not 1 or 2");
  if (!Array.isArray(v.moves)) throw invalid(`${path}.moves`, "is not an array");
  const g = new Game();
  g.turn = v.first;
  v.moves.forEach((m, i) => {
    const mp = `${path}.moves[${i}]`;
    if (g.over) throw invalid(mp, "comes after the game ended");
    if (!isObj(m)) throw invalid(mp, "is not an object");
    if (!Number.isInteger(m.c) || m.c < 0 || m.c >= COLS) throw invalid(`${mp}.c`, `is not a column index 0-${COLS - 1}`);
    if (g.height(m.c) >= ROWS) throw invalid(mp, `plays into full column index ${m.c}`);
    const say = readString(m.say, `${mp}.say`);
    g.play(m.c);
    g.moves[g.moves.length - 1].say = say;
  });
  return g;
}

// Validates stored data (format above) and returns the values applyState
// takes. readState({}) is the empty state.
function readState(data){
  if (!isObj(data)) throw invalid("the saved state", "is not an object");
  if (data.records !== undefined && !Array.isArray(data.records)) throw invalid("records", "is not an array");
  const records = (data.records || []).map((r, i) => {
    const g = readGame(r, `records[${i}]`);
    if (!g.over) throw invalid(`records[${i}]`, "is not a finished game");
    return g;
  });
  let game = null;
  if (data.game != null){
    game = readGame(data.game, "game");
    if (game.over) throw invalid("game", "is finished but is not in records");
  }
  const np = data.notesPending === undefined ? [] : data.notesPending;
  if (!Array.isArray(np) || !np.every(p => p === RED || p === YELLOW) || new Set(np).size !== np.length){
    throw invalid("notesPending", "is not a list of distinct players 1 and 2");
  }
  if (np.length && !records.length) throw invalid("notesPending", "is set but no game has finished");
  if (np.length && game) throw invalid("notesPending", "is set while a game is in progress");
  const scores = readObject(data.scores, "scores");
  return {
    records, game, notesPending: np.slice(),
    notes: readPlayers(data.notes, "notes", readString),
    plans: readPlayers(data.plans, "plans", readString),
    scores: { 1: readCount(scores[1], "scores.1"), 2: readCount(scores[2], "scores.2"),
              draws: readCount(scores.draws, "scores.draws") },
    stats: readPlayers(data.stats, "stats", (v, path) => {
      const o = readObject(v, path);
      return { truncated: readCount(o.truncated, `${path}.truncated`),
               fallbacks: readCount(o.fallbacks, `${path}.fallbacks`) };
    }),
  };
}

// The board shows the game in progress, else the last finished game, else a
// new game 1.
function applyState(s){
  state.records = s.records;
  state.notes = s.notes;
  state.notesPending = s.notesPending;
  state.plans = s.plans;
  state.scores = s.scores;
  state.stats = s.stats;
  const n = s.records.length;
  state.game = s.game || (n ? s.records[n - 1] : newGame(1));
}

// Loads the saved state at boot. Returns a one-line description of what was
// restored, or null when nothing was. A save that fails to parse or validate
// is not loaded at all: state.loadError is set, which stops saving and
// disables Start, and the stored copy is left untouched for repair from
// devtools.
function loadState(){
  const raw = localStorage.getItem(STATE_KEY);
  if (raw === null) return null;
  let s;
  try { s = readState(JSON.parse(raw)); }
  catch (e){
    if (!(e instanceof StateError || e instanceof SyntaxError)) throw e;
    const why = e instanceof SyntaxError ? "it is not valid JSON" : e.message;
    state.loadError = `Saved state not loaded: ${why}. It is kept unchanged in localStorage["${STATE_KEY}"]; fix it from devtools and reload, or press Clear state.`;
    console.error(state.loadError);
    return null;
  }
  applyState(s);
  const n = state.records.length, g = state.game;
  if (!g.over) return `Restored: game ${n + 1} at move ${g.moves.length + 1}.`;
  if (state.notesPending.length) return `Restored: game ${n} finished, notes updates pending.`;
  return `Restored: ${n} game${n === 1 ? "" : "s"} played.`;
}

// Back to the empty state, stored copy included. Settings are untouched.
function clearState(){
  if (state.running) return;
  localStorage.removeItem(STATE_KEY);
  state.loadError = null;
  applyState(readState({}));
  state.tokens[1] = { value: 0, estimated: false };
  state.tokens[2] = { value: 0, estimated: false };
  trace.game = 0;
  trace.calls = [];
  for (const p of [1, 2]){
    document.getElementById("stream" + p).innerHTML = "";
    state.firstAppend[p] = true;
    state.autoFollow[p] = true;
    updateTokenDisplay(p);
  }
  renderBoard();
  updateScoreboard();
  updateControls();
  setStatus("State cleared.");
}

/* ============================================================
   Board rendering
   ============================================================ */
// Rebuilds the whole board each call. `animate` = {c, r} names the piece just
// dropped; only it plays the drop animation, starting r + 1 cell heights above
// its slot (--dist feeds the `drop` keyframes). All other pieces render static.
function renderBoard(animate){
  const g = state.game;
  boardEl.innerHTML = "";
  const winSet = new Set();
  if (g && g.winCells) for (const [c, r] of g.winCells) winSet.add(c + "," + r);
  for (let r = 0; r < ROWS; r++){
    for (let c = 0; c < COLS; c++){
      const cell = mk("div", "cell");
      cell.style.gridColumn = String(c + 1);
      // Grid rows count from the top; board rows count from the bottom.
      cell.style.gridRow = String(ROWS - r);
      const v = g ? g.at(c, r) : 0;
      if (v){
        const piece = mk("div", "piece " + (v === RED ? "red" : "yellow"));
        if (animate && animate.c === c && animate.r === r){
          piece.style.setProperty("--dist", String(-(r + 1)));
        } else {
          piece.style.animation = "none";
        }
        cell.appendChild(piece);
      }
      if (winSet.has(c + "," + r)) cell.classList.add("win");
      boardEl.appendChild(cell);
    }
  }
}

/* ============================================================
   Deterministic board sizing + stream heights
   ============================================================ */
// Sizes the board in JS so it keeps a 7:6 ratio at the largest size the
// columns area allows. Wide layout: board fills the available height unless
// that would squeeze either side column below 240px, and both stream panels
// are set to the board's height. Narrow layout (stacked, matches the CSS
// media query): board capped at 460px wide, stream panels fixed at 260px.
// Returns early while the container has no real size yet.
function layoutBoard(){
  const cols = document.querySelector('.columns');
  if (!cols) return;
  const rect = cols.getBoundingClientRect();
  if (rect.width < 80) return;

  const isNarrow = window.matchMedia('(max-width: 1000px)').matches;

  if (isNarrow){
    const boardW = Math.min(rect.width - 4, 460);
    const boardH = Math.round(boardW * 6 / 7);
    boardEl.style.width  = boardW + 'px';
    boardEl.style.height = boardH + 'px';
    for (const p of [1, 2]){
      const panel = document.getElementById('panel' + p);
      if (panel) panel.style.height = '260px';
    }
    return;
  }

  if (rect.height < 80) return;

  const gap = 14;
  const minSide = 240;

  let boardH = rect.height - 2;
  let boardW = boardH * 7 / 6;

  const maxBoardW = rect.width - 2 * minSide - 2 * gap;
  if (boardW > maxBoardW){
    boardW = Math.max(220, maxBoardW);
    boardH = Math.round(boardW * 6 / 7);
  }

  boardEl.style.width  = Math.round(boardW) + 'px';
  boardEl.style.height = Math.round(boardH) + 'px';

  for (const p of [1, 2]){
    const panel = document.getElementById('panel' + p);
    if (panel) panel.style.height = Math.round(boardH) + 'px';
  }
}

const columnsEl = document.querySelector('.columns');
if (window.ResizeObserver && columnsEl){
  new ResizeObserver(() => layoutBoard()).observe(columnsEl);
}
window.addEventListener('resize', layoutBoard);

/* ============================================================
   Scroll / auto-follow
   ============================================================ */
function snapSideToBottom(p){
  const side = document.getElementById("side" + p);
  if (side) side.scrollTop = side.scrollHeight;
}

// Auto-follow stays on while the user is within 150px of the bottom of the
// log; scrolling further up pauses it until they scroll back down.
function checkAutoFollow(p){
  const el = document.getElementById("stream" + p);
  if (!el) return;
  const dist = el.scrollHeight - el.scrollTop - el.clientHeight;
  state.autoFollow[p] = dist < 150;
}

for (const p of [1, 2]){
  const el = document.getElementById("stream" + p);
  if (el){
    el.addEventListener("scroll", () => checkAutoFollow(p), { passive: true });
  }
}

function autoScrollStream(p){
  if (!state.autoFollow[p]) return;
  const el = document.getElementById("stream" + p);
  if (!el) return;
  el.scrollTop = el.scrollHeight;
}

/* ============================================================
   Stream entries
   ============================================================ */
function collapseAllReasoning(){
  document.querySelectorAll(".stream-body details.reasoning[open]").forEach(d => {
    d.open = false;
  });
}

function appendEvent(p, text, kind){
  const body = document.getElementById("stream" + p);
  const e = mk("div", "event" + (kind ? " " + kind : ""));
  e.appendChild(mk("div", "ts", formatTs(Date.now())));
  e.appendChild(mk("div", "event-body", text));
  body.appendChild(e);

  if (state.firstAppend[p]){
    state.firstAppend[p] = false;
    snapSideToBottom(p);
    body.scrollTop = body.scrollHeight;
    state.autoFollow[p] = true;
  } else {
    autoScrollStream(p);
  }
}

// Opens a log entry for one move (which may span several calls when play_out
// is used) or one notes update. Earlier collapsible sections in both panels
// are collapsed so only the current entry's are expanded.
function startTurnEntry(p){
  collapseAllReasoning();

  const body = document.getElementById("stream" + p);
  const entry = mk("div", "turn-entry p" + p);
  entry.appendChild(mk("div", "ts", formatTs(Date.now())));

  const details = document.createElement("details");
  details.className = "reasoning";
  details.open = true;
  const summary = document.createElement("summary");
  summary.textContent = "reasoning";
  const reasonBody = mk("div", "reasoning-body");
  details.appendChild(summary);
  details.appendChild(reasonBody);
  entry.appendChild(details);

  const moveEl = mk("div", "move");
  entry.appendChild(moveEl);

  body.appendChild(entry);

  if (state.firstAppend[p]){
    state.firstAppend[p] = false;
    snapSideToBottom(p);
    body.scrollTop = body.scrollHeight;
    state.autoFollow[p] = true;
  } else {
    autoScrollStream(p);
  }

  return { entry, reasonBody, moveEl };
}

function appendNote(entry, text){
  const n = mk("div", "note", text);
  entry.appendChild(n);
}

// Collapsible section styled like the reasoning sections.
function reasoningSection(label, text, open){
  const details = document.createElement("details");
  details.className = "reasoning";
  details.open = open;
  const summary = document.createElement("summary");
  summary.textContent = label;
  details.appendChild(summary);
  details.appendChild(mk("div", "reasoning-body", text));
  return details;
}

// One play_out call in the log: the summary line, with the exact result the
// model received collapsed underneath.
function toolCallLine(summary, result){
  const wrap = mk("div", "toolcall");
  wrap.appendChild(reasoningSection(summary, result, false));
  return wrap;
}

function refreshPlayerLabels(){
  const c1 = readConfig(1), c2 = readConfig(2);
  const fmt = (p, c) => {
    const parts = [`Player ${p}`, c.name];
    if (c.model) parts.push(c.model);
    return parts.join(" · ");
  };
  document.getElementById("label1").textContent = fmt(1, c1);
  document.getElementById("label2").textContent = fmt(2, c2);
  name1El.textContent = c1.name;
  name2El.textContent = c2.name;
}

function updateTokenDisplay(p){
  const t = state.tokens[p];
  const v = Math.round(t.value || 0).toLocaleString();
  // Failure counts are appended only once nonzero.
  const s = state.stats[p];
  let text = v + " tokens" + (t.estimated ? " (est)" : "");
  if (s.truncated) text += ` · ${s.truncated} cut off`;
  if (s.fallbacks) text += ` · ${s.fallbacks} random`;
  document.getElementById("tokens" + p).textContent = text;
}

function estimateTokens(messages){
  let chars = 0;
  for (const m of messages){
    if (!m) continue;
    if (typeof m.content === "string") chars += m.content.length;
    else if (Array.isArray(m.content)){
      for (const part of m.content) if (part && typeof part.text === "string") chars += part.text.length;
    }
    // Within a tool-call turn, assistant messages also carry reasoning and
    // tool-call arguments.
    for (const k of ["reasoning_content", "reasoning"]) if (typeof m[k] === "string") chars += m[k].length;
    if (Array.isArray(m.tool_calls)) for (const tc of m.tool_calls) chars += (tc.function?.arguments || "").length;
  }
  return Math.round(chars / 4);
}

// The displayed count is the prompt size of the latest call (a move or a
// notes update), not a running total. Without a usage report it is
// estimated from the message text at ~4 chars per token and marked "(est)".
function updateTokensAfterCall(p, usage, sentMessages){
  let value = 0, estimated = true;
  if (usage){
    const pt = usage.prompt_tokens ?? usage.promptTokens ?? usage.input_tokens;
    if (typeof pt === "number" && pt >= 0){ value = pt; estimated = false; }
  }
  if (estimated) value = estimateTokens(sentMessages);
  state.tokens[p] = { value, estimated };
  updateTokenDisplay(p);
}

/* ============================================================
   Prompts
   ============================================================ */
// Identity and rules, shared by every call. Used alone as the system prompt
// for notes updates, whose output instruction is in the user message.
// The opponent's name and model come from the series snapshot in `configs`.
function rulesPrompt(p, cfg){
  const { colorName, other, otherColor } = playerInfo(p);
  const oppCfg = configs[other];
  return `You are ${cfg.name}, Player ${p} (${colorName}), running on model ${cfg.model || "unknown"}. You are playing Connect Four against ${oppCfg.name}, Player ${other} (${otherColor}), running on model ${oppCfg.model || "unknown"}.

Game play:
- Board is 7 columns × 6 rows. Columns 1-7 left to right. Row 1 is the bottom row, row 6 the top.
- On your turn you pick a non-full column. Your piece drops to the lowest empty row in that column.
- Four of your pieces in a row — horizontal, vertical, or diagonal — wins.
- If the board fills with no winner, the game is a draw.`;
}

// System prompt for move calls: the rules, how to use each offered tool, and
// the answer format. Tool descriptions (in the tool definitions) say what each
// tool does and who sees its output; this prompt says how to use them. Every
// offered tool must be covered here.
function movePrompt(p, cfg){
  const playOut = state.toolLimit > 0
    ? `\n- play_out: use it to look at a position you are considering instead of reconstructing it in your head; the result shows that position's lines and valid moves just as your turn message does. You may call it at most ${state.toolLimit} times per move; each result shows how many calls remain.`
    : "";
  return rulesPrompt(p, cfg) + `

Tools:${playOut}
- save_plan: before you answer, use it to record anything you want to remember on your next move — your strategy, what you have worked out, what to check. Each call replaces your previous plan.
- tell_opponent: use it to talk to your opponent: taunt them, distract them, misdirect them about your plans, or answer what they said. Victory is often decided by which side has the psychological advantage. Table talk need not be truthful, and your opponent's may not be either. Anything you send becomes part of this game's table talk, which you both see on every move.
- commentary: use it to explain your thinking to the people watching the game.

You may call save_plan, tell_opponent, and commentary as often as you like; all are optional.

Answer:
When you have decided, reply with only the column number (1-7) of your move.`;
}

// One finished game as a single line from player p's point of view. `n` is
// the game's 1-based position in state.records, which is the only game
// numbering the models see.
function recordLine(p, rec, n){
  const { colorName } = playerInfo(p);
  const order = rec.moves[0].p === p ? "moved first" : "moved second";
  let result;
  if (rec.winner){
    const cells = [...rec.winCells].sort((a, b) => a[0] - b[0] || a[1] - b[1])
      .map(([c, r]) => `(${c + 1},${r + 1})`).join(" ");
    result = `${rec.winner === RED ? "Red" : "Yellow"} won with ${cells} after ${rec.moves.length} moves.`;
  } else {
    result = "draw, board full.";
  }
  return `Game ${n}: you were ${colorName}, ${order}. Moves: ${rec.toMoveList()}. Result: ${result}`;
}

function notesText(p){
  return state.notes[p] || "(none yet)";
}

// Single user message for a turn, ordered so everything before the current
// game stays identical across a game's turns (prompt-cache friendly):
// previous game records, then the player's notes, then the current position.
function stateMessage(p, g){
  const L = [];
  L.push("Previous games:");
  if (state.records.length){
    state.records.forEach((rec, i) => L.push(recordLine(p, rec, i + 1)));
  } else {
    L.push("(none yet)");
  }
  L.push("");
  L.push("Your notes from previous games:");
  L.push(notesText(p));
  L.push("");
  L.push(`Current game (game ${state.records.length + 1}):`);
  L.push(positionText(g, "Current board", p, true));
  L.push("");
  L.push(tableTalk(p, g));
  L.push("");
  L.push("Your private plan from your previous move (only you can see this):");
  L.push(state.plans[p] || "(none)");
  L.push("");
  L.push("It is your turn. Reply with the column number you'd like to play.");
  return L.join("\n");
}

// The game's tell_opponent messages from both players in move order, from
// player p's point of view. Comes from the `say` field playOneGame sets on
// each move; moves without messages are skipped. Not part of game records:
// it is shown during the game and once more in the notes update after it.
function tableTalk(p, g){
  const L = ["Table talk this game (messages sent with tell_opponent):"];
  g.moves.forEach((m, i) => {
    if (!m.say) return;
    const who = (m.p === RED ? "Red" : "Yellow") + (m.p === p ? " (you)" : "");
    const [first, ...rest] = m.say.split("\n");
    L.push(`  ${who}, move ${i + 1}: ${first}`);
    for (const line of rest) L.push("    " + line);
  });
  if (L.length === 1) L.push("  (none yet)");
  return L.join("\n");
}

// A position in every representation the models get: move list, last move,
// column stacks, piece coordinates, lines, valid moves with their results,
// and the grid. Shared by the turn message and play_out results so both
// always look the same. `toMove` is the player whose valid moves are listed
// (null when the game is over); `you` is true when that player is the reader.
function positionText(g, boardLabel, toMove, you){
  const L = [];
  const last = g.moves[g.moves.length - 1];
  L.push("Move list: " + g.toMoveList());
  L.push(last
    ? `Last move: ${last.p === RED ? "Red" : "Yellow"} played column ${last.c + 1} (landed row ${last.r + 1})`
    : "Last move: none, this is the first move of the game");
  L.push("");
  L.push("Columns, bottom to top:");
  L.push(g.toColumns());
  L.push("");
  L.push("Pieces as (column,row):");
  L.push("  Red:    " + g.toPieceList(RED));
  L.push("  Yellow: " + g.toPieceList(YELLOW));
  L.push("");
  L.push('Lines (cells in order; "+" = empty and playable now; a number = empty, with that many pieces needed in its column before it is playable):');
  L.push(g.toLines());
  L.push("");
  if (!toMove){
    L.push("No valid moves: the game is over.");
  } else {
    L.push(you ? "Your valid moves this turn are:"
               : `Valid moves for ${toMove === RED ? "Red" : "Yellow"} (to move) are:`);
    L.push("");
    L.push(g.toMoves(toMove, you));
  }
  L.push("");
  L.push(`${boardLabel}. Y=Yellow. R=Red.`);
  L.push(g.toText());
  return L.join("\n");
}

/* ============================================================
   play_out analysis tool
   ============================================================ */
// The analysis tool. It replays columns on a copy of the current game and
// reports positions and rule outcomes (landing cells, illegal moves, wins,
// draws). It deliberately never evaluates: no threats, no scores, no
// suggestions. Which lines to examine is the model's own problem.
const PLAY_OUT_TOOL = {
  type: "function",
  function: {
    name: "play_out",
    description: "Plays a sequence of columns on a private analysis board, starting from the current position and alternating moves starting with you. Returns where each piece landed and the resulting position in the same format as your turn message: move list, columns, lines, valid moves with their results, and grid. Stops at an illegal move or when the game ends. It does not evaluate positions and never affects the real game. Only you see the result.",
    parameters: {
      type: "object",
      properties: {
        moves: {
          type: "array",
          items: { type: "integer", minimum: 1, maximum: 7 },
          description: "Columns 1-7 in play order, starting with your move.",
        },
      },
      required: ["moves"],
    },
  },
};

// Private memory between a player's moves within a game (state.plans).
// Offered on every move request with no call limit, and it does not count
// against the play_out cap. Each call replaces the plan.
const SAVE_PLAN_TOOL = {
  type: "function",
  function: {
    name: "save_plan",
    description: "Stores a private plan that is shown to you at the start of your next move in this game, replacing any previous plan. Only you see it; your opponent never does.",
    parameters: {
      type: "object",
      properties: {
        plan: { type: "string", description: "Your strategy, what you have worked out, and what to check on your next move." },
      },
      required: ["plan"],
    },
  },
};

// Table talk: messages a player sends to its opponent. getMove collects them
// per move and playOneGame stores them on the move (`say`), from which
// tableTalk() shows them to both players. Unlimited, like save_plan.
const TELL_OPPONENT_TOOL = {
  type: "function",
  function: {
    name: "tell_opponent",
    description: "Sends a message to your opponent. It is added to this game's table talk, labeled with your color and move number. Both you and your opponent see the table talk on every move.",
    parameters: {
      type: "object",
      properties: {
        message: { type: "string", description: "What you want to say to your opponent." },
      },
      required: ["message"],
    },
  },
};

// Spectator commentary: shown in the log only, never sent to either model.
// Unlimited, like save_plan.
const COMMENTARY_TOOL = {
  type: "function",
  function: {
    name: "commentary",
    description: "Records commentary for the human spectators watching the game. It appears in the game log only; neither you nor your opponent ever sees it.",
    parameters: {
      type: "object",
      properties: {
        text: { type: "string", description: "Your commentary on the position or your move." },
      },
      required: ["text"],
    },
  },
};

// Validates the single string argument `key` of a text tool. Returns the
// trimmed string, or null when the arguments are malformed.
function textArg(args, key){
  try {
    const parsed = JSON.parse(args || "{}");
    return parsed && typeof parsed[key] === "string" ? parsed[key].trim() : null;
  } catch (e) { return null; }
}

// Validates one save_plan call. Returns { text, summary } like runPlayOut,
// plus `plan` when valid. The plan is not stored here: getMove returns the
// move's last plan and playOneGame commits it with the move (see state.plans).
function runSavePlan(args){
  let parsed;
  try { parsed = JSON.parse(args || "{}"); } catch (e) {
    return { text: "Error: arguments are not valid JSON. The plan was not saved.", summary: "invalid JSON arguments" };
  }
  if (!parsed || typeof parsed.plan !== "string"){
    return { text: "Error: plan must be a string. The plan was not saved.", summary: "invalid plan" };
  }
  return { text: "Plan saved.", summary: "saved", plan: parsed.plan.trim() };
}

// Validates and runs one play_out call against game `g`. Returns
// { ok, text, summary }: `text` is the tool result body (without the budget
// line), `summary` the short form for the log. Malformed arguments return
// ok: false with an error message; they still count against the call cap.
function runPlayOut(g, name, args){
  if (name !== "play_out") return { ok: false, text: `Error: unknown tool "${name}". The only tool is play_out.`, summary: `unknown tool "${name}"` };
  let parsed;
  try { parsed = JSON.parse(args || "{}"); } catch (e) {
    return { ok: false, text: "Error: arguments are not valid JSON.", summary: "invalid JSON arguments" };
  }
  const moves = parsed && parsed.moves;
  if (!Array.isArray(moves) || !moves.every(m => Number.isInteger(m) && m >= 1 && m <= 7)){
    return { ok: false, text: "Error: moves must be an array of integers 1-7.", summary: "invalid moves" };
  }

  const a = g.clone();
  const played = [], landed = [];
  let outcome = null, ended = false;
  for (let i = 0; i < moves.length; i++){
    const c = moves[i] - 1, p = a.turn;
    const tag = (p === RED ? "R" : "Y") + moves[i];
    if (a.height(c) >= ROWS){
      outcome = `Stopped: move ${i + 1} (${tag}) is illegal, column ${moves[i]} is full.`;
      break;
    }
    const r = a.drop(c, p);
    played.push(`${tag} → (${c + 1},${r + 1})`);
    landed.push(`(${c + 1},${r + 1})`);
    const win = a.checkWinFrom(c, r, p);
    if (win){
      const cells = [...win].sort((x, y) => x[0] - y[0] || x[1] - y[1]).map(([cc, rr]) => `(${cc + 1},${rr + 1})`).join(" ");
      outcome = `${p === RED ? "Red" : "Yellow"} wins with ${cells}.`;
      if (i < moves.length - 1) outcome += " Remaining moves were not played.";
      ended = true;
      break;
    }
    if (a.moves.length >= ROWS * COLS){
      ended = true;
      outcome = "Draw: board full.";
      if (i < moves.length - 1) outcome += " Remaining moves were not played.";
      break;
    }
    a.turn = p === RED ? YELLOW : RED;
  }

  const L = [];
  L.push("Played: " + (played.length ? played.join(", ") : "(nothing)"));
  if (outcome) L.push(outcome);
  L.push("");
  // Valid moves are named by color: after a sequence it may be either side's
  // turn, and "your turn" would misdescribe a hypothetical position.
  L.push(positionText(a, "Resulting board", ended ? null : a.turn, false));
  const summary = `[${moves.join(", ")}] → ` + (landed.length ? "landed " + landed.join(" ") : "nothing played") + (outcome ? ` · ${outcome}` : "");
  return { ok: true, text: L.join("\n"), summary };
}

// Budget line appended to every tool result, including errors.
// Names play_out explicitly because save_plan is never budgeted.
function budgetLine(left){
  if (left <= 0) return "No play_out calls remain; reply with your move.";
  return `${left} play_out call${left === 1 ? "" : "s"} remain${left === 1 ? "s" : ""}`;
}

/* ============================================================
   Reply parsing
   ============================================================ */
// The move is the last non-empty line, which must be exactly one digit 1-7.
// The prompt asks for only the digit; prose before it is tolerated (and
// shared with no one). Anything else on the last line ("Column 4", "**4**",
// "4.") returns null and triggers a re-prompt.
// Returns { move, text } or null; `text` is the prose before the digit.
function parseReply(raw){
  const lines = String(raw || "").trim().split("\n");
  const m = lines[lines.length - 1].trim().match(/^([1-7])$/);
  if (!m) return null;
  return { move: parseInt(m[1], 10), text: lines.slice(0, -1).join("\n").trim() };
}

/* ============================================================
   Transport
   ============================================================ */
// Parses an OpenAI-style SSE stream line by line, reading only `data:` lines
// of the first choice. Unparseable lines are skipped; an `error` payload
// throws. Reasoning arrives as `reasoning_content` or `reasoning` depending on
// the server; reasoningField records which key was used so getMove can send
// reasoning back under the same key within a tool-call turn. Tool calls arrive
// as fragments keyed by `index` (id and name once, arguments in pieces) and
// are reassembled here.
async function readSSE(res, onDelta){
  const reader = res.body.getReader();
  const dec = new TextDecoder();
  let buf = "", text = "", reasoning = "", reasoningField = null, usage = null, finishReason = null;
  const calls = [];
  while (true){
    const { value, done } = await reader.read();
    if (done) break;
    buf += dec.decode(value, { stream: true });
    let idx;
    while ((idx = buf.indexOf("\n")) >= 0){
      const line = buf.slice(0, idx).trim();
      buf = buf.slice(idx + 1);
      if (!line.startsWith("data:")) continue;
      const payload = line.slice(5).trim();
      if (payload === "[DONE]") continue;
      let json;
      try { json = JSON.parse(payload); } catch (e) { continue; }
      if (json.error) throw new Error(json.error.message || "stream error");
      if (json.usage) usage = json.usage;
      // finish_reason is null on every chunk except the last one of the choice.
      if (json.choices?.[0]?.finish_reason) finishReason = json.choices[0].finish_reason;
      const d = json.choices?.[0]?.delta || json.choices?.[0]?.message || {};
      let rc = null, field = null;
      if (typeof d.reasoning_content === "string" && d.reasoning_content){
        rc = d.reasoning_content; field = "reasoning_content";
      } else if (typeof d.reasoning === "string" && d.reasoning){
        rc = d.reasoning; field = "reasoning";
      }
      if (rc){
        reasoning += rc;
        if (!reasoningField) reasoningField = field;
        onDelta("reasoning", rc);
      }
      if (typeof d.content === "string" && d.content){
        text += d.content;
        onDelta("content", d.content);
      }
      if (Array.isArray(d.tool_calls)){
        for (const tc of d.tool_calls){
          // Fragments without `index` belong to the latest call, unless they
          // carry a different id, which starts a new call.
          let i = tc.index;
          if (i == null){
            i = Math.max(calls.length - 1, 0);
            if (tc.id && calls[i] && calls[i].id && calls[i].id !== tc.id) i = calls.length;
          }
          const c = calls[i] || (calls[i] = { id: "", name: "", arguments: "" });
          if (tc.id) c.id = tc.id;
          if (tc.function?.name && !c.name) c.name = tc.function.name;
          if (tc.function?.arguments != null) c.arguments += argText(tc.function.arguments);
        }
      }
    }
  }
  return { text, reasoning, reasoningField, usage, finishReason, toolCalls: calls.filter(Boolean) };
}

// Tool-call arguments are a JSON string per the API; some servers send an
// already-parsed object, which is normalized back to a string.
function argText(a){
  return typeof a === "string" ? a : JSON.stringify(a);
}

/* ============================================================
   Inspection trace
   ============================================================ */
// Every model call of the current game (moves, and the notes updates after
// it), with the exact request body and the parsed response. Reset when a
// game starts. Read it from devtools with calls() or calls(i).
const trace = { game: 0, calls: [] };

function traceStart(body, meta){
  // Deep copy: the turn's message list keeps growing after this call.
  const entry = { ...(meta || {}), at: new Date().toISOString(),
                  request: JSON.parse(JSON.stringify(body)), response: undefined };
  trace.calls.push(entry);
  return entry;
}

// JSON-shaped, but strings print with their real line breaks (continuation
// lines aligned under the opening quote) and nothing is escaped or omitted,
// so long prompts stay readable. Deliberately not valid JSON.
function readable(v, col){
  const pad = n => " ".repeat(n);
  if (v === undefined) return "(pending)";
  if (v === null || typeof v !== "object"){
    if (typeof v !== "string") return String(v);
    return '"' + v.split("\n").join("\n" + pad(col + 1)) + '"';
  }
  if (Array.isArray(v)){
    if (!v.length) return "[]";
    return "[\n" + v.map(x => pad(col + 2) + readable(x, col + 2)).join(",\n") + "\n" + pad(col) + "]";
  }
  const keys = Object.keys(v);
  if (!keys.length) return "{}";
  return "{\n" + keys.map(k => {
    const lead = `${pad(col + 2)}"${k}": `;
    // Strings align under their opening quote; nested containers indent
    // one level, as in ordinary pretty-printed JSON.
    return lead + readable(v[k], typeof v[k] === "string" ? lead.length : col + 2);
  }).join(",\n") + "\n" + pad(col) + "}";
}

// calls() returns every call of the current game; calls(i) returns call i.
window.calls = function(i){
  const pick = i == null ? trace.calls.map((c, n) => [n, c]) : [[i, trace.calls[i]]];
  if (!pick.length || !pick[0][1]) return `No calls recorded for game ${trace.game}${i == null ? "" : ` at index ${i}`}.`;
  return pick.map(([n, c]) => {
    const { request, response, ...meta } = c;
    return `calls[${n}]: ${readable(meta, 0)}\nrequest:\n${readable(request, 0)}\nresponse:\n${readable(response, 0)}`;
  }).join("\n\n");
};

// One chat-completions call, always routed through serve.py's same-origin
// /proxy. The endpoint may be a base URL (".../v1") or the full
// ".../chat/completions" URL. `tools` (optional) is the tool list to offer.
// Returns { text, reasoning, reasoningField, usage, finishReason, toolCalls }
// whether or not the response was streamed; finishReason is "length" when
// max_tokens cut it off, and toolCalls is [{ id, name, arguments }].
// `meta` labels the call in the inspection trace (see calls()).
async function chat(cfg, messages, onDelta, tools, meta){
  const ctrl = new AbortController();
  state.abort = ctrl;

  const base = cfg.endpoint.replace(/\/+$/, "");
  const upstream = /\/chat\/completions$/.test(base) ? base : base + "/chat/completions";
  const url = "/proxy?url=" + encodeURIComponent(upstream);

  const body = { model: cfg.model, messages };
  if (cfg.reasoning) body.reasoning_effort = cfg.reasoning;
  if (cfg.maxTokens > 0) body.max_tokens = cfg.maxTokens;
  if (tools && tools.length) body.tools = tools;
  if (cfg.stream){
    body.stream = true;
    body.stream_options = { include_usage: true };
  }

  // Every call is recorded with the exact body sent and what came back (or
  // the error), so calls() can show the whole protocol exchange.
  const entry = traceStart(body, meta);
  try {
    const out = await post(cfg, url, body, ctrl, onDelta);
    entry.response = out;
    return out;
  } catch (e){
    entry.response = { error: e.name === "AbortError" ? "aborted" : e.message };
    throw e;
  }
}

// The HTTP half of chat(): sends `body` and parses the reply.
async function post(cfg, url, body, ctrl, onDelta){
  const headers = { "Content-Type": "application/json" };
  if (cfg.key) headers["Authorization"] = "Bearer " + cfg.key;

  let res;
  try {
    res = await fetch(url, { method: "POST", signal: ctrl.signal, headers, body: JSON.stringify(body) });
  } catch (e){
    if (e.name === "AbortError") throw e;
    throw new Error(`${cfg.name}: network error — ${e.message}. Is the local proxy running?`);
  }

  if (!res.ok){
    let detail = "";
    try { detail = (await res.text()).slice(0, 400); } catch (e) {}
    throw new Error(`${cfg.name}: HTTP ${res.status} ${res.statusText}${detail ? " — " + detail : ""}`);
  }

  // A server may ignore `stream: true` and answer with plain JSON, so the
  // response content type decides which parser runs.
  const ct = (res.headers.get("content-type") || "").toLowerCase();
  if (cfg.stream && ct.includes("text/event-stream")){
    return await readSSE(res, onDelta);
  }

  const data = await res.json();
  if (data.error) throw new Error(`${cfg.name}: ${data.error.message || JSON.stringify(data.error)}`);
  const msg = data.choices?.[0]?.message || {};
  let text = "";
  if (typeof msg.content === "string") text = msg.content;
  else if (Array.isArray(msg.content)) text = msg.content.map(x => x.text || "").join("");
  let reasoning = "", reasoningField = null;
  if (typeof msg.reasoning_content === "string" && msg.reasoning_content){
    reasoning = msg.reasoning_content; reasoningField = "reasoning_content";
  } else if (typeof msg.reasoning === "string" && msg.reasoning){
    reasoning = msg.reasoning; reasoningField = "reasoning";
  }
  const toolCalls = (Array.isArray(msg.tool_calls) ? msg.tool_calls : []).map(tc => ({
    id: tc.id || "", name: tc.function?.name || "", arguments: argText(tc.function?.arguments ?? ""),
  }));
  if (reasoning) onDelta("reasoning", reasoning);
  if (text) onDelta("content", text);
  return { text, reasoning, reasoningField, usage: data.usage || null,
           finishReason: data.choices?.[0]?.finish_reason || null, toolCalls };
}

/* ============================================================
   Turn execution
   ============================================================ */
// Asks player p for a move. Each turn is one fresh conversation that starts
// with the system prompt and a single stateMessage carrying past records,
// notes, and the current position; tool exchanges and retries are appended
// within the turn. Nothing from the turn is kept afterwards except the
// player's plan, if it calls save_plan.
//
// Within the turn the model may call play_out up to state.toolLimit times,
// and save_plan any number of times.
// Protocol:
// - A response containing tool calls is a tool step: the calls run (any text
//   is ignored) and the turn continues. Every play_out call counts against
//   the cap, malformed ones included. Once the cap is used up, requests are
//   sent without play_out. save_plan is always offered and unlimited by
//   decision, so a model that keeps calling only save_plan is not bounded;
//   Stop ends such a turn.
// - A response without tool calls is the final answer, parsed by parseReply.
//   Failed answers are retried up to MAX_RETRIES times; retries keep the
//   turn's tool exchanges and do not reset the cap. A generation cut off by
//   max_tokens is one failed attempt (unless it is an answer that still
//   parses as a legal move). A response that calls a tool when none was
//   offered also counts as a failed attempt; that rule is what bounds a model
//   that ignores the withdrawal.
// - After MAX_RETRIES failed attempts, a random legal column is played.
// Reasoning is sent back on the turn's assistant messages under the key the
// server used, so the model keeps its line of thought across tool calls.
async function getMove(p, g){
  const cfg = configs[p];
  const { entry, reasonBody: firstReasonBody, moveEl } = startTurnEntry(p);
  // Everything in the entry is shown in order, above the final move line.
  const put = el => { entry.insertBefore(el, moveEl); return el; };

  const msgs = [
    { role: "system", content: movePrompt(p, cfg) },
    { role: "user", content: stateMessage(p, g) },
  ];

  const legalCols = g.legal();
  const legalHuman = legalCols.map(c => c + 1);
  let callsLeft = state.toolLimit;
  let callSeq = 0;
  let generation = 0;
  // tell_opponent messages sent this turn, in order; becomes the move's `say`.
  const messages = [];
  // The last plan saved this turn, or null if none; committed with the move.
  let plan = null;

  for (let attempt = 1; attempt <= MAX_RETRIES; ){
    // One reasoning section per generation; the first was made by startTurnEntry.
    // Later sections are created on the first reasoning text, so generations
    // without reasoning add no empty sections.
    let reasonBody = generation++ === 0 ? firstReasonBody : null;
    const ensureBody = () => {
      if (!reasonBody){
        collapseAllReasoning();
        reasonBody = put(reasoningSection("reasoning", "", true)).querySelector(".reasoning-body");
      }
      return reasonBody;
    };

    // save_plan, tell_opponent and commentary are always offered; play_out
    // only while calls remain.
    const playOutOffered = callsLeft > 0;
    const always = [SAVE_PLAN_TOOL, TELL_OPPONENT_TOOL, COMMENTARY_TOOL];
    const tools = playOutOffered ? [PLAY_OUT_TOOL, ...always] : always;
    // Live reasoning display keeps only the last 20,000 characters.
    const res = await chat(cfg, msgs, (type, chunk) => {
      if (type === "reasoning"){
        ensureBody().textContent += chunk;
        if (reasonBody.textContent.length > 20000) reasonBody.textContent = reasonBody.textContent.slice(-20000);
        autoScrollStream(p);
      }
    }, tools, { player: `${p} (${p === RED ? "Red" : "Yellow"})`, kind: "move",
                move: g.moves.length + 1, attempt, generation });

    // Stop may land after the response already completed (so no AbortError);
    // bail out rather than play the move.
    if (!state.running) throw new StopError();

    updateTokensAfterCall(p, res.usage, msgs);
    // The panel is normally filled from the same reasoning text via onDelta;
    // only if nothing was displayed is the final reasoning shown here.
    if (res.reasoning && !(reasonBody && reasonBody.textContent.trim())) ensureBody().textContent = String(res.reasoning);

    const truncated = res.finishReason === "length";
    if (res.toolCalls.length && !truncated){
      const am = { role: "assistant", content: res.text || null };
      if (res.reasoning && res.reasoningField) am[res.reasoningField] = res.reasoning;
      am.tool_calls = res.toolCalls.map(tc => ({
        id: tc.id || `call_${p}_${++callSeq}`,
        type: "function",
        function: { name: tc.name, arguments: tc.arguments },
      }));
      msgs.push(am);
      // Text alongside tool calls does not count as an answer, but is shown
      // so it is visible what the model wrote.
      if (res.text && res.text.trim()) put(reasoningSection("text with tool calls (not used as the answer)", res.text, false));
      let calledWithdrawn = false;
      for (const tc of am.tool_calls){
        let body, summary, label;
        if (tc.function.name === "save_plan"){
          const r = runSavePlan(tc.function.arguments);
          body = r.text; summary = r.summary;
          if (r.plan != null) plan = r.plan;
          label = `save_plan ${summary}`;
          // Shown inline, not collapsed: the plan is the model's own account
          // of its strategy and is meant to be read as the game goes.
          const planEl = mk("div", "plan");
          planEl.appendChild(mk("div", "plan-label", label));
          if (r.plan != null) planEl.appendChild(mk("div", "plan-body", r.plan || "(empty)"));
          put(planEl);
        } else if (tc.function.name === "tell_opponent" || tc.function.name === "commentary"){
          const key = tc.function.name === "tell_opponent" ? "message" : "text";
          const text = textArg(tc.function.arguments, key);
          if (text === null){
            body = `Error: ${key} must be a string. Nothing was sent.`;
            summary = `invalid ${key}`;
          } else if (tc.function.name === "tell_opponent"){
            messages.push(text);
            body = "Message added to the table talk.";
            summary = "sent";
          } else {
            body = "Commentary recorded.";
            summary = "recorded";
          }
          label = `${tc.function.name} ${summary}`;
          // Inline, like save_plan: these are meant to be read as they happen.
          const el = mk("div", tc.function.name === "tell_opponent" ? "plan tell" : "plan commentary-tool");
          el.appendChild(mk("div", "plan-label", label));
          if (text) el.appendChild(mk("div", "plan-body", text));
          put(el);
        } else {
          // play_out and any unknown tool name share the play_out budget, so
          // every non-save_plan call counts against the cap.
          if (!playOutOffered){
            calledWithdrawn = true;
            body = "Error: play_out is not available for the rest of this move.";
            summary = "not run";
          } else if (callsLeft > 0){
            callsLeft--;
            const r = runPlayOut(g, tc.function.name, tc.function.arguments);
            body = r.text; summary = r.summary;
          } else {
            body = "Error: the call was not run.";
            summary = "not run";
          }
          label = tc.function.name === "play_out" ? `play_out ${summary}` : summary;
        }
        // The play_out budget line ends every result while the tool exists.
        const content = state.toolLimit > 0 ? body + "\n" + budgetLine(callsLeft) : body;
        msgs.push({ role: "tool", tool_call_id: tc.id, content });
        // The text tools already have their inline entry; only play_out and
        // unknown calls get the collapsible result line.
        if (!["save_plan", "tell_opponent", "commentary"].includes(tc.function.name)){
          put(toolCallLine(`${label} · ${budgetLine(callsLeft)}`, content));
        }
      }
      autoScrollStream(p);
      if (!calledWithdrawn) continue;
      // play_out was not offered but the model called it (or another unknown
      // tool) anyway: the error results above tell it so, and the attempt
      // counts as failed so a model that keeps calling cannot loop forever.
      // save_plan has no such bound by design.
      put(mk("div", "note", `Called a tool that was not available (attempt ${attempt}/${MAX_RETRIES}) — re-prompting…`));
      attempt++;
      continue;
    }

    // Final answer, or a cut-off generation. A cut-off generation that
    // contained tool calls is a failed attempt (its calls are dropped); a
    // cut-off reply without tool calls that still parses as a legal move is
    // played.
    const parsed = truncated && res.toolCalls.length ? null : parseReply(res.text);
    const moveInt = parsed ? parsed.move : null;
    let col = null;
    if (moveInt !== null && legalCols.includes(moveInt - 1)) col = moveInt - 1;

    if (col !== null){
      // Prose before the digit goes to no one; it is shown here only so the
      // log reflects everything the model wrote.
      if (parsed.text) put(reasoningSection("reply text (not shared)", parsed.text, false));
      moveEl.textContent = "→ column " + (col + 1);
      autoScrollStream(p);
      return { col, messages, plan };
    }

    // A reply cut off by max_tokens is reported as such, not as a bad answer.
    // A parseable reply that fails here named a full column.
    let why, retry;
    if (truncated){
      state.stats[p].truncated++;
      why = `Hit max tokens (${cfg.maxTokens}) before answering`;
      retry = `Your response was cut off before it gave a move. Legal columns right now are: ${legalHuman.join(", ")}. Reply with only the column number.`;
    } else if (moveInt !== null){
      why = `Column ${moveInt} is full`;
      retry = `Column ${moveInt} is full. Legal columns right now are: ${legalHuman.join(", ")}. Reply with only the column number.`;
    } else {
      why = "Reply was not a column number";
      retry = `Your reply must be only the column number. Legal columns right now are: ${legalHuman.join(", ")}. Reply with only the column number.`;
    }
    updateTokenDisplay(p);
    put(mk("div", "note", `${why} (attempt ${attempt}/${MAX_RETRIES}) — re-prompting…`));
    // The rejected reply exactly as received, for diagnosing format failures.
    put(reasoningSection("rejected reply", res.text || "(empty)", false));
    const am = { role: "assistant", content: res.text || "(no content)" };
    if (res.reasoning && res.reasoningField) am[res.reasoningField] = res.reasoning;
    msgs.push(am);
    msgs.push({ role: "user", content: retry });
    attempt++;
  }

  state.stats[p].fallbacks++;
  updateTokenDisplay(p);
  const fallback = legalCols[Math.floor(Math.random() * legalCols.length)];
  put(mk("div", "note", `No valid move after ${MAX_RETRIES} attempts — playing random column ${fallback + 1}.`));
  moveEl.textContent = "→ column " + (fallback + 1) + " (fallback)";
  autoScrollStream(p);
  // Messages and the plan from the turn stand even on a fallback.
  return { col: fallback, messages, plan };
}

/* ============================================================
   Notes update (after each game)
   ============================================================ */
// One call per player after a game, with no retries. The reply replaces the
// player's notes. A reply cut off by max_tokens, or an empty one, keeps the
// previous notes, since a partial rewrite could silently drop what the model
// meant to keep. The 300-word limit is only an instruction; staying within it
// is part of what is being evaluated, so the reply is never trimmed.
async function updateNotes(p){
  const cfg = configs[p];
  const n = state.records.length;
  const { entry, reasonBody, moveEl } = startTurnEntry(p);

  const content = [
    `Game ${n} is over.`,
    recordLine(p, state.records[n - 1], n),
    "",
    tableTalk(p, state.records[n - 1]),
    "",
    "Your current notes:",
    notesText(p),
    "",
    "Rewrite your notes for future games in this series: what you learned about this opponent and about your own play. Keep them under 300 words. Reply with only the notes.",
  ].join("\n");
  const msgs = [
    { role: "system", content: rulesPrompt(p, cfg) },
    { role: "user", content },
  ];

  const res = await chat(cfg, msgs, (type, chunk) => {
    if (type === "reasoning"){
      reasonBody.textContent += chunk;
      if (reasonBody.textContent.length > 20000) reasonBody.textContent = reasonBody.textContent.slice(-20000);
      autoScrollStream(p);
    }
  }, null, { player: `${p} (${p === RED ? "Red" : "Yellow"})`, kind: "notes", game: n });
  if (!state.running) throw new StopError();
  updateTokensAfterCall(p, res.usage, msgs);

  if (!reasonBody.textContent.trim() && res.reasoning) reasonBody.textContent = String(res.reasoning);

  const notes = (res.text || "").trim();
  if (res.finishReason === "length" || !notes){
    const why = res.finishReason === "length" ? `hit max tokens (${cfg.maxTokens})` : "empty reply";
    moveEl.textContent = "Notes unchanged";
    appendNote(entry, `Notes update failed (${why}); keeping previous notes.`);
  } else {
    state.notes[p] = notes;
    moveEl.textContent = "Notes updated";
    const details = document.createElement("details");
    details.className = "reasoning";
    details.open = true;
    const summary = document.createElement("summary");
    summary.textContent = "notes";
    details.appendChild(summary);
    details.appendChild(mk("div", "reasoning-body", notes));
    entry.appendChild(details);
  }
  autoScrollStream(p);
}

/* ============================================================
   One full game
   ============================================================ */
// The inspection trace covers one game plus the notes updates after it.
function traceGame(n){
  if (trace.game !== n){ trace.game = n; trace.calls = []; }
}

function resultText(g, n){
  return g.winner === RED ? `${configs[1].name} (Red) wins game ${n}`
    : g.winner === YELLOW ? `${configs[2].name} (Yellow) wins game ${n}`
    : `Game ${n} ends in a draw`;
}

// Runs the notes updates still owed for the last finished game, saving after
// each, so a Stop or reload resumes with only the remaining ones. A failed
// update (cut off or empty) still counts as done, as there are no retries.
async function runPendingNotes(){
  const n = state.records.length;
  traceGame(n);
  const text = resultText(state.records[n - 1], n);
  while (state.notesPending.length){
    const p = state.notesPending[0];
    setStatus(`${text} · ${configs[p].name} updating notes…`);
    // Throws StopError on Stop, leaving p pending; a normal return means the
    // update completed.
    await updateNotes(p);
    state.notesPending.shift();
    saveState();
  }
  setStatus(text);
}

// Plays the game on the board if it is in progress, resuming at its next
// move, otherwise a new game. Then records it, runs both notes updates, and
// waits out the countdown.
async function playOneGame(){
  const n = state.records.length + 1;
  let g = state.game;
  const resumed = !g.over && g.moves.length > 0;
  if (g.over){
    g = state.game = newGame(n);
    // Plans are per game; lessons across games belong in the notes.
    state.plans = { 1: "", 2: "" };
    saveState();
  }
  traceGame(n);

  renderBoard();

  const startMsg = resumed
    ? `— Game ${n} resumes at move ${g.moves.length + 1} —`
    : `— Game ${n} begins · ${g.turn === RED ? "Red" : "Yellow"} first —`;
  appendEvent(1, startMsg);
  appendEvent(2, startMsg);
  setStatus(`Game ${n} ${resumed ? "resuming" : "starting"}…`);

  while (!g.over){
    if (!state.running) return;
    const p = g.turn;
    const colorName = p === 1 ? "Red" : "Yellow";

    setStatus(`Game ${n} · move ${g.moves.length + 1} — ${configs[p].name} (${colorName}) thinking…`);
    const result = await getMove(p, g);
    if (!state.running) return;

    const c = result.col;
    const r = g.play(c);
    // Table talk for this move: its tell_opponent messages, one per line.
    g.moves[g.moves.length - 1].say = result.messages.join("\n");
    if (result.plan !== null) state.plans[p] = result.plan;
    if (g.over){
      if (g.winner) state.scores[g.winner]++;
      else state.scores.draws++;
      // Recorded in the same save as the final move, so a stored game is
      // never finished without being in records.
      state.records.push(g);
      state.notesPending = [1, 2];
    }
    saveState();

    renderBoard({ c, r });
    if (g.over) updateScoreboard();
  }

  const text = resultText(g, n);
  const resultKind = g.winner === 0 ? "draw" : "win";
  appendEvent(1, text, resultKind);
  appendEvent(2, text, resultKind);
  setStatus(text);

  await runPendingNotes();

  await sleep(1000);
  if (!state.running) return;

  let secs = Math.max(0, Math.min(120, parseInt(gameDelayEl.value, 10) || 0));
  if (secs > 0){
    const msg = `Next game in ${secs} s`;
    appendEvent(1, msg, "countdown");
    appendEvent(2, msg, "countdown");
    await runCountdown(secs);
  } else {
    setStatus("Next game starting…");
    await sleep(200);
  }
}

async function runCountdown(totalSeconds){
  const end = Date.now() + totalSeconds * 1000;
  while (state.running){
    const remaining = Math.max(0, Math.ceil((end - Date.now()) / 1000));
    setStatus(`Next game in ${remaining} s…`);
    if (remaining <= 0) return;
    await sleep(200);
  }
}

/* ============================================================
   Series loop
   ============================================================ */
async function startSeries(){
  if (state.running) return;

  configs[1] = readConfig(1);
  configs[2] = readConfig(2);
  state.toolLimit = Math.max(0, parseInt(toolLimitEl.value, 10) || 0);
  for (const p of [1, 2]){
    const c = configs[p];
    if (!c.endpoint || !c.model){
      alert(`Please set the endpoint and model for Player ${p} (${p === 1 ? "Red" : "Yellow"}).`);
      return;
    }
  }
  refreshPlayerLabels();

  state.running = true;
  updateScoreboard();
  updateControls();

  appendEvent(1, `Series started — ${configs[1].name} vs ${configs[2].name}.`);
  appendEvent(2, `Series started — ${configs[1].name} vs ${configs[2].name}.`);

  try {
    // Notes updates left over from a Stop or reload after a game ended run
    // first; the next game then starts without a countdown.
    if (state.notesPending.length) await runPendingNotes();
    while (state.running){
      await playOneGame();
      if (!state.running) break;
    }
  } catch (err){
    // Any error ends the whole series. Errors caused by Stop (the aborted
    // fetch, StopError, or anything thrown once running is false) are expected
    // and not reported; everything else is shown in both logs and the status bar.
    const benign = err && (err.name === "AbortError" || err.name === "StopError" || !state.running);
    if (!benign){
      console.error(err);
      appendEvent(1, "Error: " + (err.message || String(err)), "note");
      appendEvent(2, "Error: " + (err.message || String(err)), "note");
      setStatus("Error: " + (err.message || String(err)));
    }
  } finally {
    state.running = false;
    state.abort = null;
    updateControls();
    if (!statusEl.textContent.startsWith("Error")) setStatus("Stopped.");
  }
}

function stopSeries(){
  if (!state.running) return;
  state.running = false;
  if (state.abort){ try { state.abort.abort(); } catch (e) {} }
  setStatus("Stopping…");
  updateControls();
}

/* ============================================================
   UI updates
   ============================================================ */
function updateScoreboard(){
  score1El.textContent = state.scores[1];
  score2El.textContent = state.scores[2];
  scoreDEl.textContent = state.scores.draws;
  name1El.textContent = configs[1].name;
  name2El.textContent = configs[2].name;
}

function updateControls(){
  stopBtn.disabled = !state.running;
  startBtn.textContent = state.running ? "▶ Running…" : "▶ Start series";
  // A failed load keeps Start off so nothing overwrites the stored copy.
  startBtn.disabled = state.running || !!state.loadError;
  // Clear state only between runs, never under an in-flight call.
  clearStateBtn.disabled = state.running;
}

/* ============================================================
   Wiring
   ============================================================ */
startBtn.addEventListener("click", () => startSeries());
stopBtn.addEventListener("click", () => stopSeries());
clearStateBtn.addEventListener("click", () => clearState());

resetScoresBtn.addEventListener("click", () => {
  if (state.running && !confirm("Reset the scoreboard mid-series?")) return;
  state.scores = { 1: 0, 2: 0, draws: 0 };
  state.stats = { 1: { truncated: 0, fallbacks: 0 }, 2: { truncated: 0, fallbacks: 0 } };
  saveState();
  updateScoreboard();
  updateTokenDisplay(1);
  updateTokenDisplay(2);
});

window.addEventListener("beforeunload", (e) => {
  if (state.running){ e.preventDefault(); e.returnValue = ""; }
});

/* ============================================================
   Boot
   ============================================================ */
loadSettings();
const restored = loadState();
refreshPlayerLabels();
renderBoard();
requestAnimationFrame(layoutBoard);
updateScoreboard();
updateTokenDisplay(1);
updateTokenDisplay(2);
updateControls();
if (state.loadError){
  setStatus(state.loadError);
} else if (restored){
  appendEvent(1, restored);
  appendEvent(2, restored);
  setStatus(restored + " Press Start to continue.");
} else {
  setStatus("Ready. Configure the two endpoints and press Start.");
}

if (location.protocol === "file:"){
  setStatus("This page must be served by serve.py — open http://localhost:8000/ instead of the file directly.");
}
})();
</script>
</body>
</html>
