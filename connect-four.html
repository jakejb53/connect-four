<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Connect Four · AI vs AI</title>
<style>
  :root{
    --bg:#0b1020; --panel:#121a2e; --panel2:#0a1024; --line:#27324f;
    --text:#e6ebf5; --muted:#8b97b5;
    --red:#e5484d; --yellow:#f5c542;
    --red-soft:#f0a5a7; --yellow-soft:#f0dca0;
    --ts:#7a8496;
    color-scheme: dark;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0;
    background:radial-gradient(1200px 700px at 50% -15%, #1c2748, #0b1020 60%);
    color:var(--text);
    font:14px/1.5 ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  }
  .app{
    display:flex;flex-direction:column;
    height:100vh;
    padding:12px;
    gap:10px;
  }

  /* ---------- top bar ---------- */
  .topbar{display:flex;flex-direction:column;gap:8px;flex:none}
  .topbar-row{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
  .brand{font-weight:800;font-size:18px;letter-spacing:.2px}
  .brand span{color:var(--muted);font-weight:500;font-size:12px;margin-left:4px}
  .scoreboard{display:flex;gap:8px;margin-left:auto}
  .score{display:flex;align-items:center;gap:7px;background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:4px 12px;font-variant-numeric:tabular-nums}
  .score .lbl{color:var(--muted);font-size:11px}
  .score .val{font-weight:800;font-size:15px}
  .dot{width:11px;height:11px;border-radius:50%;display:inline-block;flex:none}
  .dot.red{background:var(--red);box-shadow:0 0 8px rgba(229,72,77,.7)}
  .dot.yellow{background:var(--yellow);box-shadow:0 0 8px rgba(245,197,66,.7)}
  .controls{display:flex;flex-wrap:wrap;align-items:center;gap:6px;flex:1}
  button{
    background:var(--panel);color:var(--text);border:1px solid var(--line);
    border-radius:8px;padding:6px 12px;font:inherit;font-size:12.5px;cursor:pointer;
    transition:background .15s,border-color .15s,opacity .15s;
  }
  button:hover:not(:disabled){background:#1b2540;border-color:#3b4a72}
  button:disabled{opacity:.4;cursor:not-allowed}
  button.primary{background:linear-gradient(180deg,#2f6bff,#2350d8);border-color:#3f7bff;font-weight:600}
  button.primary:hover:not(:disabled){background:linear-gradient(180deg,#3f7bff,#2b5ce8)}
  .inline{display:flex;align-items:center;gap:6px;color:var(--muted);font-size:12px;margin-left:auto}
  .inline + .inline{margin-left:0}
  .inline input{width:64px;background:var(--panel2);border:1px solid var(--line);border-radius:6px;color:var(--text);padding:4px 7px;font:inherit;font-size:12px}
  .status{
    background:var(--panel);border:1px solid var(--line);border-radius:8px;
    padding:7px 12px;font-size:12.5px;color:#b9c6e2;min-height:32px;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  }

  /* ---------- 3-column layout ---------- */
  .columns{
    flex:1;
    display:flex;
    gap:14px;
    min-height:0;
    align-items:stretch;
  }
  .side{
    flex:1 1 0;
    min-width:240px;
    min-height:0;
    display:flex;
    flex-direction:column;
    gap:10px;
    overflow-y:auto;
    scroll-behavior:smooth;
  }

  /* config card */
  .config-card{
    background:var(--panel);border:1px solid var(--line);border-radius:12px;
    padding:10px 12px;flex:none;
  }
  .card-head{display:flex;align-items:center;gap:8px;font-weight:700;margin-bottom:8px;font-size:13px}
  .card-head .tag{
    font-weight:600;font-size:10.5px;color:var(--muted);background:#0a1024;
    border:1px solid var(--line);border-radius:999px;padding:1px 8px;margin-left:auto;
  }
  .field-row{display:flex;align-items:center;gap:8px;margin-bottom:5px}
  .field-row>label{width:64px;color:var(--muted);font-size:11.5px;flex:none}
  .field-row>input,.field-row>select{flex:1;min-width:0}
  .field-row-2{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:5px}
  .field-half{display:flex;align-items:center;gap:6px;min-width:0}
  .field-half>label{color:var(--muted);font-size:11.5px;min-width:36px;flex:none}
  .field-half>input,.field-half>select{flex:1;min-width:0}
  .field-half input[type=checkbox]{flex:none;width:16px;height:16px;accent-color:#3f7bff}
  input[type=text],input[type=password],input[type=number],select{
    background:var(--panel2);border:1px solid var(--line);border-radius:6px;
    color:var(--text);padding:5px 8px;font:inherit;font-size:12.5px;min-width:0;
  }
  input:focus,select:focus{outline:none;border-color:#3f7bff}

  /* stream panel */
  .stream-panel{
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:12px;
    display:flex;
    flex-direction:column;
    min-height:0;
    overflow:hidden;
    height:400px;
    flex:0 0 auto;
  }
  .stream-header{
    flex:none;display:flex;align-items:center;justify-content:space-between;gap:10px;
    padding:8px 12px;border-bottom:1px solid var(--line);font-size:12.5px;font-weight:700;
  }
  .stream-header .player-label{
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
    min-width:0;flex:1;padding-right:6px;
  }
  .stream-header .tokens{
    font-weight:500;color:var(--muted);font-size:11.5px;font-variant-numeric:tabular-nums;
    flex:none;white-space:nowrap;
  }
  .stream-body{
    flex:1 1 0;
    min-height:0;
    overflow-y:auto;
    padding:8px 12px;
    scrollbar-width:thin;
  }
  .stream-body::-webkit-scrollbar{width:9px}
  .stream-body::-webkit-scrollbar-thumb{background:#27324f;border-radius:6px}
  .stream-body::-webkit-scrollbar-thumb:hover{background:#33416a}

  /* stream entries */
  .ts{font-size:11px;color:var(--ts);margin-bottom:4px;font-variant-numeric:tabular-nums}
  .turn-entry{padding:8px 0;border-bottom:1px dashed rgba(255,255,255,.06)}
  .turn-entry:last-child{border-bottom:none}
  .turn-entry details.reasoning summary{
    cursor:pointer;user-select:none;font-size:11px;color:var(--muted);
    list-style:none;padding:1px 0;
  }
  .turn-entry details.reasoning summary::-webkit-details-marker{display:none}
  .turn-entry details.reasoning summary::before{content:'▸ ';font-size:10px}
  .turn-entry details.reasoning[open] summary::before{content:'▾ '}
  .turn-entry details.reasoning summary:hover{color:#b6c3de}
  .turn-entry .reasoning-body{
    margin-top:4px;padding:6px 9px;background:var(--panel2);border-radius:7px;
    font-family:ui-monospace,SFMono-Regular,Menlo,monospace;
    font-size:11.5px;line-height:1.45;white-space:pre-wrap;word-break:break-word;
  }
  .turn-entry.p1 .reasoning-body{color:var(--red-soft)}
  .turn-entry.p2 .reasoning-body{color:var(--yellow-soft)}
  .turn-entry .move{margin-top:6px;font-weight:700;font-size:13px}
  .turn-entry.p1 .move{color:var(--red)}
  .turn-entry.p2 .move{color:var(--yellow)}
  .turn-entry .note{
    margin-top:5px;font-size:11px;color:#ffcf7a;font-style:italic;
  }
  .turn-entry .toolcall{margin-top:5px}
  .turn-entry .plan.tell{border-left-color:#ffcf7a}
  .turn-entry .plan.tell .plan-label{color:#ffcf7a}
  .turn-entry .plan.commentary-tool{border-left-color:#8ff0a4}
  .turn-entry .plan.commentary-tool .plan-label{color:#8ff0a4}
  .turn-entry .plan{margin-top:6px;padding:6px 9px;background:var(--panel2);border-left:2px solid #9fd3ff;border-radius:4px}
  .turn-entry .plan-label{font-size:11px;color:#9fd3ff;font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
  .turn-entry .plan-body{margin-top:3px;font-size:12px;white-space:pre-wrap;word-break:break-word}
  .turn-entry .toolcall details.reasoning summary{
    color:#9fd3ff;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;
  }

  .event{padding:7px 0;border-bottom:1px dashed rgba(255,255,255,.04)}
  .event:last-child{border-bottom:none}
  .event .event-body{font-size:12px;font-style:italic;color:var(--muted)}
  .event.win .event-body{color:#8ff0a4}
  .event.draw .event-body{color:#cfc78a}
  .event.note .event-body{color:#9fb0d6;font-style:normal}

  /* board column + board */
  .board-col{
    flex:0 0 auto;
    display:flex;
    align-items:center;
    justify-content:center;
    min-height:0;
  }
  .board{
    display:grid;
    grid-template-columns:repeat(7,1fr);
    grid-template-rows:repeat(6,1fr);
    gap:6px;
    padding:10px;
    background:linear-gradient(180deg,#1d2848,#141c31);
    border-radius:16px;
    width:500px;
    height:428px;
    box-shadow:0 20px 60px rgba(0,0,0,.55), inset 0 0 0 1px var(--line);
  }
  .cell{
    position:relative;border-radius:50%;
    background:#080d1c;
    box-shadow:inset 0 4px 8px rgba(0,0,0,.85), inset 0 -1px 0 rgba(255,255,255,.04);
    transition:box-shadow .25s;
  }
  .cell.win{box-shadow:0 0 0 2px #fff,0 0 22px rgba(255,255,255,.5),inset 0 4px 8px rgba(0,0,0,.5)}
  .piece{position:absolute;inset:6%;border-radius:50%;animation:drop .38s cubic-bezier(.35,1.35,.6,1) both}
  .piece.red{background:radial-gradient(circle at 33% 27%, #ff9a9d, var(--red) 58%, #8e1b1f)}
  .piece.yellow{background:radial-gradient(circle at 33% 27%, #ffeeaa, var(--yellow) 58%, #9c7a17)}
  @keyframes drop{
    from{transform:translateY(calc(var(--dist,0) * 116%))}
    to{transform:translateY(0)}
  }

  @media (max-width:1000px){
    .app{ height:auto; min-height:100vh; }
    .columns{
      flex-direction:column;
      flex:0 0 auto;
      overflow:visible;
    }
    .side{
      flex:0 0 auto;
      min-width:0;
      min-height:0;
      overflow-y:visible;
    }
    .board-col{ flex:0 0 auto; order:-1; }
    .stream-panel{ height:260px; }
  }
</style>
</head>
<body>
<div class="app">
  <header class="topbar">
    <div class="topbar-row">
      <div class="brand">Connect&nbsp;Four <span>AI&nbsp;vs&nbsp;AI</span></div>
      <div class="scoreboard">
        <div class="score"><span class="dot red"></span><span class="val" id="score1">0</span><span class="lbl" id="name1">Red</span></div>
        <div class="score"><span class="dot yellow"></span><span class="val" id="score2">0</span><span class="lbl" id="name2">Yellow</span></div>
        <div class="score"><span class="val" id="scoreD">0</span><span class="lbl">Draws</span></div>
      </div>
    </div>
    <div class="topbar-row">
      <div class="controls">
        <button id="startBtn" class="primary">▶ Start series</button>
        <button id="stopBtn" disabled>■ Stop</button>
        <button id="resetScoresBtn">Reset scores</button>
        <button id="clearStateBtn">Clear state</button>
        <label class="inline">Countdown <input id="gameDelay" type="number" value="10" min="0" max="120" step="1"> s</label>
        <label class="inline">Tool calls <input id="toolLimit" type="number" value="10" min="0" step="1"> / move</label>
      </div>
    </div>
    <div class="status" id="status">Idle — configure both agents, then press Start.</div>
  </header>

  <div class="columns">
    <aside class="side" id="side1">
      <div class="config-card" id="card1"></div>
      <div class="stream-panel" id="panel1">
        <div class="stream-header">
          <span class="player-label" id="label1">Player 1 · Red</span>
          <span class="tokens" id="tokens1">0 tokens</span>
        </div>
        <div class="stream-body" id="stream1"></div>
      </div>
    </aside>

    <main class="board-col">
      <div class="board" id="board"></div>
    </main>

    <aside class="side" id="side2">
      <div class="config-card" id="card2"></div>
      <div class="stream-panel" id="panel2">
        <div class="stream-header">
          <span class="player-label" id="label2">Player 2 · Yellow</span>
          <span class="tokens" id="tokens2">0 tokens</span>
        </div>
        <div class="stream-body" id="stream2"></div>
      </div>
    </aside>
  </div>
</div>

<script>
(() => {
"use strict";

const ROWS = 6, COLS = 7;
// Piece colors double as player numbers (Red = Player 1), so code uses them
// interchangeably and finds the other player with `3 - p`.
const RED = 1, YELLOW = 2;
const MAX_RETRIES = 3;
const LS_KEY = "c4-ai-v1";
// Saved series state (see "State persistence"); separate from the settings
// under LS_KEY so Clear state never touches settings.
const STATE_KEY = "c4-ai-state";

/* ============================================================
   Game engine
   ============================================================ */
class Game {
  constructor(){
    // Column-major: cols[c][r] is the piece at column c, row r, with r = 0 the
    // bottom row. A column's array length is its fill height. All indices are
    // 0-based; only prompts and UI text use 1-based numbers.
    this.cols = Array.from({length: COLS}, () => []);
    this.moves = [];
    this.turn = RED;
    this.over = false;
    this.winner = 0;
    this.winCells = null;
  }
  // Independent copy for the play_out analysis board; the real game is never
  // touched by analysis.
  clone(){
    const g = new Game();
    g.cols = this.cols.map(col => col.slice());
    g.moves = this.moves.map(m => ({ ...m }));
    g.turn = this.turn;
    g.over = this.over;
    g.winner = this.winner;
    g.winCells = this.winCells && this.winCells.map(cell => cell.slice());
    return g;
  }
  at(c, r){ const col = this.cols[c]; return (col && col[r]) || 0; }
  height(c){ return this.cols[c].length; }
  legal(){ const a = []; for (let c = 0; c < COLS; c++) if (this.cols[c].length < ROWS) a.push(c); return a; }
  drop(c, p){ const r = this.cols[c].length; this.cols[c].push(p); this.moves.push({c, r, p}); return r; }
  // Plays column c for the side to move and applies the rules: a win or a
  // full board ends the game, otherwise the turn passes. The single move rule
  // shared by live play and replaying saved games. Returns the landing row.
  play(c){
    const p = this.turn;
    const r = this.drop(c, p);
    const win = this.checkWinFrom(c, r, p);
    if (win){ this.over = true; this.winner = p; this.winCells = win; }
    else if (this.moves.length >= ROWS * COLS) this.over = true;  // draw: winner stays 0
    else this.turn = p === RED ? YELLOW : RED;
    return r;
  }
  // Checks only lines through the piece just placed at (c, r); any earlier
  // win would already have ended the game. Returns the connected cells (4+)
  // for highlighting, or null.
  checkWinFrom(c, r, p){
    const dirs = [[1,0],[0,1],[1,1],[1,-1]];
    for (const [dc, dr] of dirs){
      const cells = [[c, r]];
      for (const s of [1, -1]){
        let cc = c + dc*s, rr = r + dr*s;
        while (cc >= 0 && cc < COLS && rr >= 0 && rr < ROWS && this.at(cc, rr) === p){
          cells.push([cc, rr]); cc += dc*s; rr += dr*s;
        }
      }
      if (cells.length >= 4) return cells;
    }
    return null;
  }
  // Board as sent to the models: top row printed first, 1-based column and
  // row labels matching the numbering defined in rulesPrompt().
  toText(){
    const lines = [];
    lines.push("    " + Array.from({length: COLS}, (_, i) => i + 1).join(" "));
    for (let r = ROWS - 1; r >= 0; r--){
      const row = [];
      for (let c = 0; c < COLS; c++){
        const v = this.at(c, r);
        row.push(v === RED ? "R" : v === YELLOW ? "Y" : ".");
      }
      lines.push(" " + (r + 1) + "  " + row.join(" "));
    }
    return lines.join("\n");
  }

  // The methods below restate the position in forms that need no counting
  // across grid lines: they add no analysis, only what is on the board.
  // All numbers are 1-based, as in toText().

  // Moves in play order as color + column, e.g. "R4 Y4 R3".
  toMoveList(){
    if (!this.moves.length) return "(none)";
    return this.moves.map(m => (m.p === RED ? "R" : "Y") + (m.c + 1)).join(" ");
  }

  // One line per column, pieces listed bottom to top, with the row the next
  // piece would land in (or "full").
  toColumns(){
    const lines = [];
    for (let c = 0; c < COLS; c++){
      const col = this.cols[c];
      const pieces = col.length ? col.map(v => v === RED ? "R" : "Y").join(" ") : "(empty)";
      const next = col.length < ROWS ? `next piece lands row ${col.length + 1}` : "full";
      lines.push(`  ${c + 1}: ${pieces} → ${next}`);
    }
    return lines.join("\n");
  }

  // Each player's pieces as (column,row) pairs, ordered by column then row.
  toPieceList(p){
    const out = [];
    for (let c = 0; c < COLS; c++){
      for (let r = 0; r < this.cols[c].length; r++){
        if (this.cols[c][r] === p) out.push(`(${c + 1},${r + 1})`);
      }
    }
    return out.length ? out.join(" ") : "(none)";
  }

  // One cell as "(column,row)" plus R, Y, "+" (empty and playable now:
  // directly above the top piece of its column) or a number: how many pieces
  // must go into the column before the square is playable. The gap is what a
  // human sees as empty squares below it; who will fill them is left to the
  // model. Shared by the line and valid-move views.
  cellText(c, r){
    const v = this.at(c, r);
    const gap = r - this.height(c);
    const mark = v === RED ? "R" : v === YELLOW ? "Y" : (gap === 0 ? "+" : String(gap));
    return `(${c + 1},${r + 1})${mark}`;
  }

  // Every row, and every diagonal of four or more cells, as a sequence of
  // cells (see cellText). This is the grouping into lines a human sees at a
  // glance; it names no threats.
  toLines(){
    const run = (c, r, dc, dr) => {
      const out = [];
      for (; c >= 0 && c < COLS && r >= 0 && r < ROWS; c += dc, r += dr) out.push(this.cellText(c, r));
      return out.join(" ");
    };
    const L = [];
    L.push("  Rows:");
    for (let r = 0; r < ROWS; r++) L.push(`    row ${r + 1}: ` + run(0, r, 1, 0));
    // Diagonal starts on the left and bottom edges whose runs reach 4 cells.
    L.push("  Diagonals ↗ (up-right):");
    for (let r = ROWS - 4; r >= 1; r--) L.push("    " + run(0, r, 1, 1));
    for (let c = 0; c <= COLS - 4; c++) L.push("    " + run(c, 0, 1, 1));
    L.push("  Diagonals ↘ (down-right):");
    for (let r = 3; r < ROWS - 1; r++) L.push("    " + run(0, r, 1, -1));
    for (let c = 0; c <= COLS - 4; c++) L.push("    " + run(c, ROWS - 1, 1, -1));
    return L.join("\n");
  }

  // Each valid move for player p and what it produces: the lines through the
  // landing square with the piece already placed (gap counts above it updated
  // accordingly) and the square that becomes playable above it. This is what
  // a human sees by picturing the piece in the square; it names no threats
  // and never says whether a move wins. `you` words it for the reader's own
  // move ("you"), otherwise by color (play_out positions where the other side
  // is to move). The column line runs from the bottom up to the placed piece
  // (everything above is empty); diagonals shorter than four cells are
  // omitted, as in toLines().
  toMoves(p, you){
    const who = p === RED ? "Red" : "Yellow";
    const L = [], full = [];
    for (let c = 0; c < COLS; c++){
      if (this.height(c) >= ROWS){ full.push(c + 1); continue; }
      const a = this.clone();
      const r = a.drop(c, p);
      const through = (dc, dr) => {
        let cc = c, rr = r;
        while (cc - dc >= 0 && cc - dc < COLS && rr - dr >= 0 && rr - dr < ROWS){ cc -= dc; rr -= dr; }
        const out = [];
        for (; cc >= 0 && cc < COLS && rr >= 0 && rr < ROWS; cc += dc, rr += dr) out.push(a.cellText(cc, rr));
        return out;
      };
      const sq = `(${c + 1},${r + 1})`;
      if (L.length) L.push("");
      L.push(`Move: ${c + 1}`);
      L.push(you ? `Result if you choose ${c + 1}: your piece lands at ${sq}.`
                 : `Result if ${who} chooses ${c + 1}: ${who}'s piece lands at ${sq}.`);
      L.push(`  row ${r + 1}: ` + through(1, 0).join(" "));
      const col = [];
      for (let rr = 0; rr <= r; rr++) col.push(a.cellText(c, rr));
      L.push(`  col ${c + 1}: ` + col.join(" "));
      for (const [label, dc, dr] of [["↗", 1, 1], ["↘", 1, -1]]){
        const d = through(dc, dr);
        if (d.length >= 4) L.push(`  ${label}: ` + d.join(" "));
      }
      L.push(r + 1 < ROWS ? `  Square now playable above it: (${c + 1},${r + 2})` : "  The column is now full.");
    }
    for (const c of full){
      if (L.length) L.push("");
      L.push(`Column ${c} is full and is not a valid move.`);
    }
    return L.join("\n");
  }
}

/* ============================================================
   Global state
   ============================================================ */
const state = {
  running: false,
  // The game on the board: in progress (not over), or the last finished game
  // (over, and also the last entry of records). Start resumes the former and
  // begins a new game after the latter. A game's number is always
  // records.length + 1 while it is in progress.
  game: new Game(),
  scores: { 1: 0, 2: 0, draws: 0 },
  // Per-player failure counts: attempts cut off by max_tokens, and turns that
  // fell back to a random move. Cleared together with the scores.
  stats: { 1: { truncated: 0, fallbacks: 0 }, 2: { truncated: 0, fallbacks: 0 } },
  // What carries across games, until Clear state. Each turn starts a fresh
  // conversation built from these plus the current game; earlier turns are
  // not resent.
  // records: finished Game objects in play order, shared by both players and
  //   rendered from each player's point of view by recordLine().
  // notes: each player's own notebook, rewritten by updateNotes() after
  //   every game.
  records: [],
  notes: { 1: "", 2: "" },
  // Players whose notes update for the last finished game has not completed,
  // in the order they run. Set when a game ends; Start runs any left over
  // (after Stop or a reload) before the next game.
  notesPending: [],
  // Each player's private plan, written with save_plan (each call replaces
  // it) and shown only to that player on its next move. Cleared when a game
  // starts; a move that saves nothing leaves the previous plan in place.
  // Committed only when the move is played, so an interrupted move that is
  // restarted sees the same plan it saw the first time.
  plans: { 1: "", 2: "" },
  // play_out calls allowed per move, read from the setting at series start
  // (like `configs`). 0 means the tool is not offered at all.
  toolLimit: 0,
  tokens: { 1: { value: 0, estimated: false }, 2: { value: 0, estimated: false } },
  // firstAppend: the next log entry should also scroll the whole side column
  // to the bottom (set at load and after Clear state).
  // autoFollow: the log panel is near the bottom, so new output keeps it there.
  firstAppend: { 1: true, 2: true },
  autoFollow: { 1: true, 2: true },
  // AbortController of the in-flight chat request, used by Stop.
  abort: null,
  // Message from a saved state that failed validation, or null. While set,
  // nothing is saved and Start is disabled, so the stored copy stays intact
  // for repair; Clear state is the way out.
  loadError: null,
};
